name: gobelisk-voice-agent

# The agent uses host networking because Pir² (media 8090, SFU 7000) and the
# GPU services are bound to localhost on the Pir² host. Adjust the URLs in
# config.yaml if you split the stack across machines.

services:
  whisper:
    build:
      context: ../..
      dockerfile: deploy/voice-agent/whisper-gpu.Dockerfile
    image: gobelisk-whisper-gpu:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE: ${WHISPER_COMPUTE:-float16}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # XTTS-v2 (Hungarian) behind the OpenAI /v1/audio/speech API.
  tts:
    image: ghcr.io/matatonic/openedai-speech:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8880:8000"
    environment:
      TTS_HOME: /app/voices
      HF_HOME: /app/voices
      PRELOAD_MODEL: xtts
    volumes:
      - tts-voices:/app/voices
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  agent:
    build:
      context: ../..
      dockerfile: deploy/voice-agent/Dockerfile
    image: gobelisk-agent:latest
    restart: unless-stopped
    network_mode: host
    depends_on:
      - whisper
      - ollama
      - tts
    volumes:
      - ./config.yaml:/etc/gobelisk/config.yaml:ro
      - ./transcripts:/transcripts
    command:
      - agent
      - run
      - --config
      - /etc/gobelisk/config.yaml
      - --session
      - ${MEETING_SESSION_ID:?set MEETING_SESSION_ID}

volumes:
  ollama:
  tts-voices:
