voice_agent:
  uid: voice-agent
  display_name: AI Assistant
  role: guest
  language: hu

  # Pir² media control service (internal bind, see pir2/deployment/docker)
  media_service_url: http://127.0.0.1:8090
  media_internal_token: change-me
  sfu_signaling_url: ws://127.0.0.1:7000/ws

  meeting_id: ""
  # Prefer passing this with --session / MEETING_SESSION_ID.
  meeting_session_id: ""

  system_prompt: |
    Te egy segítőkész, magyar nyelvű hangasszisztens vagy egy online
    megbeszélésen. Röviden, természetes beszédstílusban válaszolj.
    Ha nem tudsz valamit, mondd meg őszintén.
  greeting: "Jó napot kívánok! Miben segíthetek?"
  max_history: 20

  vad:
    energy_threshold: 500
    silence_ms: 450
    min_speech_ms: 300
    pre_roll_ms: 250

  # faster-whisper CUDA service (deploy/voice-agent/whisper-gpu.Dockerfile)
  asr:
    endpoint: http://127.0.0.1:8000/transcribe
    language: hu
    timeout_seconds: 30

  # Ollama on GPU. Pull the model once:
  #   docker compose exec ollama ollama pull qwen2.5:3b-instruct
  llm:
    endpoint: http://127.0.0.1:11434/v1/chat/completions
    model: qwen2.5:3b-instruct
    temperature: 0.2
    max_tokens: 256
    timeout_seconds: 60
    keep_alive: "-1"

  # XTTS-v2 on GPU (openedai-speech). Hungarian is auto-detected.
  tts:
    endpoint: http://127.0.0.1:8880/v1/audio/speech
    model: tts-1-hd
    voice: alloy
    format: wav
    timeout_seconds: 60

  transcript:
    dir: /transcripts
    recorder_url: http://127.0.0.1:8080
    recorder_token: ""
    recording_id: ""
    language: hu
