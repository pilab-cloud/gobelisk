version: '3.8'

services:
  whisper-asr:
    build:
      context: .
      dockerfile: Dockerfile
    image: faster-whisper-inmemory:latest
    container_name: poc-whisper-asr
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - WHISPER_MODEL=small # vagy large-v3-turbo, ha van GPU
      - WHISPER_DEVICE=cpu   # vagy cuda
      - WHISPER_COMPUTE=int8 # int8 CPU-n, float16 GPU-n
    # GPU használat esetén vedd ki a kommentet:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
