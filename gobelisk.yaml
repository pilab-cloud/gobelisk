# Gobelisk PBX & Voice Agent Configuration
# This file configures the PBX server, audio codecs, and local GPU voice AI stack.

server:
  host: "0.0.0.0"
  udp_port: 15060
  tcp_port: 15060
  tls_port: 15061
  grpc_port: 9090

auth:
  type: "none"
  realm: "gobelisk"

features:
  call_waiting: true
  ring_timeout_seconds: 20
  # Hold/resume policy (GOBELISK-10): reject hold offers (a=sendonly/recvonly/
  # inactive) with 403 when disabled; per-extension overrides win.
  hold:
    enabled: true
    per_extension: {}
  # Do Not Disturb (GOBELISK-14): incoming calls to these extensions are
  # rejected with 603 Declined and ring groups skip them.
  dnd_extensions: []
  # Call forwarding (GOBELISK-15), per extension:
  #   unconditional: every call goes to the target (CFU)
  #   busy: used instead of 486 when busy and call waiting is off (CFB)
  #   no_answer + no_answer_seconds: after N seconds of ringing (CFNA)
  call_forward: {}
  #  call_forward:
  #    "201":
  #      unconditional: "100"
  #      busy: "102"
  #      no_answer: "105"
  #      no_answer_seconds: 20
  # Feature codes (GOBELISK-18): dialed as a number by a registered caller.
  #   dnd_on / dnd_off toggle DND for the caller's extension,
  #   park puts the caller into the next free park orbit slot.
  feature_codes:
    enabled: true
    dnd_on: "*78"
    dnd_off: "*79"
    park: "*70"
  # Call parking (GOBELISK-12): slots are the numbers
  # orbit_start .. orbit_start+orbit_size-1 (unregistered numbers only —
  # a registered extension always rings normally). timeout is how long a
  # call may wait parked before the server hangs it up.
  park:
    orbit_start: 701
    orbit_size: 10
    timeout_seconds: 300

# Provisioned SIP/PSTN/IAX trunks (GOBELISK-24). The server registers
# outbound with digest auth and monitors health with OPTIONS probes
# (GOBELISK-25). This file is the durable store; gobelisk manage trunk
# CRUD applies until the next reload.
trunks: []
#  - name: uplink
#    type: sip            # sip | pstn | iax (iax is provisioned only)
#    host: sip.provider.example.com
#    port: 5060
#    transport: udp
#    username: gw-user
#    password: s3cret
#    from_domain: sip.provider.example.com
#    callerid: "+3612345678"
#    enabled: true
#    register_expires: 3600
#    context: from-trunk  # inbound destination (GOBELISK-20)
#    retry_seconds: 30
#    health_interval_seconds: 60
#    health_timeout_seconds: 3

# Outbound routes (GOBELISK-21 / GOBELISK-22): pattern -> trunk, lowest
# cost wins (ties keep this order). Patterns are exact digits or a
# trailing-* prefix ("0*" matches 0630...); prefix_strip removes leading
# digits before dialing the trunk. callerid (GOBELISK-23) is presented as
# the From user to the trunk; empty falls back to the trunk's callerid.
outbound_routes: []
#  - name: budapest-out
#    pattern: "0*"
#    trunk: uplink
#    prefix_strip: 1
#    cost: 10
#    callerid: "+3612345678"

# Inbound routes (GOBELISK-20): DID -> destination for calls arriving on
# a trunk (trunk empty = any trunk). DID patterns match like outbound.
# cid_strip / cid_prefix (GOBELISK-23) rewrite the caller ID the
# destination sees: strip leading digits, then prepend.
inbound_routes: []
#  - name: did-sales
#    did: "3612345*"
#    trunk: uplink
#    destination: "200"
#    cid_strip: 2
#    cid_prefix: "+36"

# Pluggable speech-to-text / text-to-speech engine (optional).
# The core build ships a no-op engine. AI implementations register themselves
# with speech.Register and are selected here by name. Example for the
# gobelisk-ai module:
#
# speech:
#   engine: whisper-piper
#   options:
#     asr:
#       # endpoint: http://127.0.0.1:8099   # preloaded whisper-server (recommended)
#       model_path: /opt/whisper/models/ggml-large-v3-turbo-q5_0.bin
#       device: "1"
#       language: hu
#       timeout_seconds: 120
#     tts:
#       command: piper
#       model_path: /opt/piper/models/hu_HU-anna-medium.onnx
#       voice: anna
speech:
  engine: ""
  options: {}
